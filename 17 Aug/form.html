<h1>Mca Student Registration Form</h1>
<form action="#">
    <label for="name">Student Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter Your Name" required><br><br>

    <label for="email">Email Id:</label>
    <input type="email" id="email" name="email" placeholder="Enter Your Email Id" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter Your Password" required><br><br>

    <label for="rollno">Roll Number:</label>
    <input type="text" id="rollno" name="rollno" placeholder="Enter Your Roll Number" required><br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required><br><br>

    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label><br><br>

    <label for="dropdown">Semester:</label>
    <select id="dropdown" name="semester" required>
        <option value="Semester 1">Semester 1</option>
        <option value="Semester 2">Semester 2</option>
        <option value="Semester 3">Semester 3</option>
        <option value="Semester 4">Semester 4</option>
    </select><br><br>

    <label for="dropdown">Languages Known:</label><br>
    <input type="checkbox" id="java" name="language" value="Java">
    <label for="java">Java</label>
    <input type="checkbox" id="python" name="language" value="Python">
    <label for="python">Python</label>
    <input type="checkbox" id="javascript" name="language" value="JavaScript">
    <label for="javascript">JavaScript</label><br><br>
    <input type="checkbox" id="c++" name="language" value="C++">
    <label for="c++">C++</label>
    <input type="checkbox" id="c#" name="language" value="C#">
    <label for="c#">C#</label>
    <input type="checkbox" id="php" name="language" value="PHP">
    <label for="php">PHP</label><br><br>

    <label for="address">Address:</label>
    <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter Your Address" required></textarea><br><br>

    <label for="city">City:</label>
    <input type="text" id="city" name="city" placeholder="Enter Your City" required><br><br>

    <label for="state">State:</label>
    <input type="text" id="state" name="state" placeholder="Enter Your State" required><br><br>

    <label for="country">Country:</label>
    <input type="text" id="country" name="country" placeholder="Enter Your Country" required><br><br>
    
    
    <label for="photo">Upload Your Photo:</label><br>
    <input type="file" id="photo" name="photo" accept="image/*"><br><br>

  <iframe width="560" height="315" src="https://www.youtube.com/embed/5dlrOosqSb8?si=pvRWWHl15g4glMxS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><br><br>

    <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio><br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">  
</form>
