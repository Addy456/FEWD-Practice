<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            color:Black;
            background-color: blue;
            /* width: 100px;
            height: 30px; */
            padding: 30px 20px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            transition: transform 0.3s ease;
            transform-origin: left;
        }

        .btn:hover{
            background-color: red;
            transform: scaleX(1.2);
        }
        .box{
            width:100px;
            height:100px;
            background-color: blue;
            animation: moveBox 3s infinite;
        }
        @keyframes moveBox{
            0%{
                transform:translate(0);
            }
            50%{
                transform:translate(300px);
            }
            100%{
                transform:translate(0);
            }
        }
    </style>
</head>
<body>
    <button class="btn">
        Hover Me
    </button>
    <div class="box">

    </div>
    
</body>
</html>
