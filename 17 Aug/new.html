
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .student {
            color: green;
            font-size: 20px;
        }

        #special {
            color: red;
            font-weight: bold;
        }

        .RGBcolor{
            color: rgb(0, 200, 100);
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <p class="student">Student 1</p>
    <p class="student">Student 2</p>

    <p id="special">This is a special paragraph.</p>
    <h2 class = "RGBcolor">RGB Color Palette using CSS</h2>

</body>
</html>
